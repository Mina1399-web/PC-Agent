name: Public review build
on:
  push:
    branches: ['codex/**']
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  pull_request:
    branches: ['codex/signpath-submission-prep']
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-review:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.401'
      - name: Submission preparation regression checks
        shell: pwsh
        run: |
          foreach ($test in @('Test-SigningDependencyInventory.ps1','Test-SubmissionManifest.ps1','Test-InstallerSource.ps1','Test-HostedSubmissionGuards.ps1')) {
            & (Join-Path $PSHOME 'pwsh.exe') -NoProfile -NonInteractive -File (Join-Path './tools/tests' $test)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Release build
        shell: pwsh
        run: |
          dotnet --info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build HostAgent.sln --configuration Release -m:1 -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Core, portable Windows integration and desktop tests
        shell: pwsh
        run: |
          dotnet test tests/HostAgent.Core.Tests/HostAgent.Core.Tests.csproj --configuration Release --no-build --logger trx --results-directory "$env:RUNNER_TEMP/test-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Keep identity-, elevation-, install-, and OS-image-specific tests in
          # the complete approved Windows 11 DEV VM suite. GitHub's hosted
          # runner is not a substitute for its non-admin operator account or
          # exact VM identity. Do not weaken those tests to make hosted CI pass.
          $hostedFilter = 'FullyQualifiedName!~ReleaseToolingTests&FullyQualifiedName!~InstallerStagingTests&FullyQualifiedName!~CompleteProbeGuardVmIntegrationTests&FullyQualifiedName!~UserMaintenanceTests&FullyQualifiedName!~HostAgentDataDirectoryTests&FullyQualifiedName!~WindowsCollectorIntegrationTests'
          dotnet test tests/HostAgent.Infrastructure.Tests/HostAgent.Infrastructure.Tests.csproj --configuration Release --no-build --filter $hostedFilter --logger trx --results-directory "$env:RUNNER_TEMP/test-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # These two real user-maintenance UI cases also require a normal
          # non-admin token; retain them in the complete DEV VM suite.
          dotnet test tests/HostAgent.Desktop.Tests/HostAgent.Desktop.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName!~MaintenanceUiTests' --logger trx --results-directory "$env:RUNNER_TEMP/test-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore pinned submission build inputs
        shell: pwsh
        run: ./tools/Restore-SubmissionTools.ps1 -OutputPath "$env:RUNNER_TEMP/submission-tools"
      - name: Unsigned MSI submission candidate and artifact checks
        shell: pwsh
        run: |
          $tools = "$env:RUNNER_TEMP/submission-tools"
          ./tools/Build-SubmissionPreview.ps1 -PackagePath "$env:RUNNER_TEMP/HostAgent-1.2.8-submission-preview" -Version 1.2.8 -WixPath "$tools/wix/wix.exe" -DtfRoot $tools -WixSourceArchive "$tools/wix-source-aa65968c419420d32e3e1b647aea0082f5ca5b78.zip"
      - name: Preserve unsigned submission candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/HostAgent-1.2.8-submission-preview.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.sha }}
          path: ${{ runner.temp }}/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14
